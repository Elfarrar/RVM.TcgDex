# Build + teste + portao de cobertura.
#
# ⚠️ NAO e caller do RVM.Actions@v1, e o desvio e deliberado: repositorio PUBLICO nao consegue
# chamar reusable workflow de repositorio PRIVADO (o run morre em 0s, zero jobs, sem mensagem).
# Mesma decisao do RVM.DesignSystem (ADR-011 de la). De quebra, repo publico tem runner do GitHub
# de graca — sem runner self-hosted no BagEnd.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: tcgdex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          # net8.0 e alvo da biblioteca: o SDK do global.json compila, mas o runtime 8 precisa
          # estar la para quem um dia rodar os testes nesse alvo.
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RVM.TcgDex.slnx

      - name: Build
        # Release liga TreatWarningsAsErrors na biblioteca.
        run: dotnet build RVM.TcgDex.slnx --no-restore --configuration Release

      - name: Test (com cobertura)
        run: |
          rm -rf ./coverage-results
          dotnet test test/RVM.TcgDex.Tests/RVM.TcgDex.Tests.csproj \
            --no-build --configuration Release \
            --logger "console;verbosity=minimal" \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage-results \
            --settings coverlet.runsettings

      - name: Portao de cobertura (>= 80%)
        run: |
          XML=$(find ./coverage-results -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$XML" ]; then
            echo "::error::Cobertura nao gerada — nenhum teste rodou?"
            exit 1
          fi
          python3 - "$XML" <<'PY' >> $GITHUB_STEP_SUMMARY
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line = float(root.attrib.get("line-rate", 0)) * 100
          branch = float(root.attrib.get("branch-rate", 0)) * 100
          print("## Cobertura\n")
          print(f"| Line | **{line:.2f}%** |\n|---|---|\n| Branch | **{branch:.2f}%** |")
          if line < 80:
              print(f"::error::Cobertura {line:.2f}% abaixo do portao de 80%.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Pack (confere que o pacote monta)
        run: dotnet pack src/RVM.TcgDex/RVM.TcgDex.csproj --no-build -c Release -o nupkgs -p:Version=0.0.0-ci
