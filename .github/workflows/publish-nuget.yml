# Publica o RVM.TcgDex no nuget.org — SO por tag vX.Y.Z.
#
# A versao E a tag, e a tag aponta para o commit exato que gerou o pacote (regra do ecossistema
# desde 08/09/2026). Nunca literal no csproj: senao a versao vira alvo movel.
#
# nuget.org nao aceita republicar a mesma versao — pacote publicado errado se corrige com versao
# nova (e `unlist` da ruim), nunca sobrescrevendo.
#
# Credencial: Trusted Publishing (OIDC) desde 08/10/2026 — politica "RVM.TcgDex" no nuget.org do
# `rvenerosomorici` (repo Elfarrar/RVM.TcgDex, workflow publish-nuget.yml, sem environment). O NuGet/login
# troca o token do GitHub por uma chave temporaria a cada run: nenhuma API key guardada, nada expira.
name: Publish NuGet

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # Trusted Publishing: o token OIDC que o nuget.org troca pela chave temporaria

concurrency:
  group: tcgdex-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack + push (nuget.org)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          global-json-file: global.json

      - name: Versao a partir da tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::A tag '$GITHUB_REF_NAME' nao e vX.Y.Z (nem vX.Y.Z-sufixo)."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test antes de publicar
        # So o unitario: o projeto de contrato (tambem na solution) bate na API real, e publicar
        # nao pode depender da rede da TCGdex. O contrato tem o contract.yml dele.
        run: dotnet test test/RVM.TcgDex.Tests/RVM.TcgDex.Tests.csproj -c Release

      - name: Pack
        run: dotnet pack src/RVM.TcgDex/RVM.TcgDex.csproj -c Release -o nupkgs -p:Version="$VERSION" -p:RepositoryCommit="$GITHUB_SHA"

      - name: Login no nuget.org (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: rvenerosomorici

      - name: Push
        env:
          KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "nupkgs/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$KEY" --skip-duplicate

      - name: Conferir no feed
        # --skip-duplicate sai com sucesso sem publicar: so vale se a versao aparecer no nuget.org.
        # A indexacao leva alguns minutos.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://api.nuget.org/v3-flatcontainer/rvm.tcgdex/index.json | grep -q "\"$VERSION\""; then
              echo "RVM.TcgDex $VERSION no nuget.org (tentativa $i)"; exit 0
            fi
            sleep 20
          done
          echo "::error::RVM.TcgDex $VERSION nao apareceu no nuget.org em 10 min."; exit 1
